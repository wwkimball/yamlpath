# This workflow will install dependencies, EYAML (from Ruby), and run all tests
# and linting tools with every supported version of Python.
# @see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            test-tools-constraints: requirements/test-tools/py310.txt
          - python-version: '3.11'
            test-tools-constraints: requirements/test-tools/py311.txt
          - python-version: '3.12'
            test-tools-constraints: requirements/test-tools/py312.txt
          - python-version: '3.13'
            test-tools-constraints: requirements/test-tools/py313.txt
          - python-version: '3.14'
            test-tools-constraints: requirements/test-tools/py314.txt

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set Environment Variables
      run: |
        echo "${HOME}/.local/share/gem/ruby/3.0.0/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        gem install --user-install hiera-eyaml
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools
        python -m pip install --upgrade wheel
        python -m pip install -r ${{ matrix.test-tools-constraints }}
        python -m pip install --editable .
    - name: Validate Compliance with pydocstyle
      run: |
        pydocstyle yamlpath
    - name: Validate Compliance with MyPY
      run: |
        mypy yamlpath
    - name: Lint with pylint
      run: |
        pylint yamlpath
    - name: Unit Test with pytest
      run: |
        pytest --verbose --cov=yamlpath --cov-report=term-missing --cov-fail-under=100 --script-launch-mode=subprocess tests
