# Test publishing to PyPI.
# @see:  https://packaging.python.org/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Upload Python TEST Package

on:
  workflow_dispatch:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  validate:
    name: Code Quality Assessment
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        ruby-version: ['3.4']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
    - name: Install EYAML
      run: |
        ruby_constraints_file="requirements/test-tools/ruby-${{ matrix.ruby-version }}.txt"
        if ! [ -f "$ruby_constraints_file" ]; then
          echo "ERROR: Unsupported Ruby branch for CI: ${{ matrix.ruby-version }}" >&2
          echo "Expected dependency file not found: $ruby_constraints_file" >&2
          exit 1
        fi
        gem install --user-install --no-document -g "$ruby_constraints_file" --no-lock
        ruby_gem_user_bin="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin"
        echo "$ruby_gem_user_bin" >> "$GITHUB_PATH"
        "$ruby_gem_user_bin/eyaml" --version
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools
        python -m pip install --upgrade wheel
        python -m pip install -r requirements/test-tools/python-${{ matrix.python-version }}.txt
        python -m pip install --editable .
    - name: Validate Compliance with pydocstyle
      run: |
        pydocstyle yamlpath
    - name: Validate Compliance with MyPY
      run: |
        mypy yamlpath
    - name: Lint with pylint
      run: |
        pylint yamlpath
    - name: Unit Test with pytest
      run: |
        pytest --verbose --cov=yamlpath --cov-report=term-missing --cov-fail-under=100 --script-launch-mode=subprocess tests

  publish:
    name: Publish to TEST PyPI
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: 'PyPI:  Test'
    needs: validate

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade build setuptools wheel
    - name: Build Artifacts
      run: |
        sed -i -r -e "s/(^__version__[[:space:]]*=[[:space:]]*)("'"'"[[:digit:]](\.[[:digit:]])+)"'"'"/\1\2.RC$(date "+%Y%m%d%H%M%S")"'"'"/" yamlpath/__init__.py
        python -m build
    - name: Publish Artifacts
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
